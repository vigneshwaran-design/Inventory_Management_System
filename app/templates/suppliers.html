{% extends "layout.html" %} {% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Suppliers</h2>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Supplier Name</th>
        <th>Contact</th>
        <th>Email</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      {% for s in suppliers %}
      <tr>
        <td>{{ s.Supplier_ID }}</td>
        <td>{{ s.Supplier_Name }}</td>
        <td>{{ s.Contact }}</td>
        <td>{{ s.Email }}</td>
        <td>{{ s.Created_At.strftime("%Y-%m-%d") }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
